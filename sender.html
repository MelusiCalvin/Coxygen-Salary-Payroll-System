<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Streaming Payments — Sender Dashboard</title>
  <link rel="icon" href="assets/images/Coxygen logo.png" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">Coxygen Streaming Payroll</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="ms-auto">
          <a href="sender.html" class="btn btn-primary me-2">Sender Dashboard</a>
          <a href="recipient.html" class="btn btn-outline-primary">Recipient Dashboard</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1 py-4">
    <div class="container-fluid">
      <div id="walletInfo" class="mb-3"></div>
      <div class="row g-4">
        <!-- Create Stream Card -->
        <div class="col-lg-4 col-md-6">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">Create Stream</h5>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="recipientAddressInput" class="form-label">Recipient Address</label>
                <input id="recipientAddressInput" class="form-control" placeholder="e.g. Addr..." />
              </div>
              <div class="mb-3">
                <label for="totalAmountInput" class="form-label">Total Amount (ADA)</label>
                <input id="totalAmountInput" type="number" class="form-control" placeholder="1000" />
              </div>
              <div class="mb-3">
                <label for="startInput" class="form-label">Start (local)</label>
                <input id="startInput" type="datetime-local" class="form-control" />
              </div>
              <div class="mb-3">
                <label for="endInput" class="form-label">End (local)</label>
                <input id="endInput" type="datetime-local" class="form-control" />
              </div>
              <div class="d-grid gap-2">
                <button id="createStreamBtn" class="btn btn-success btn-lg">Create Stream</button>
                <button id="exportCsvBtn" class="btn btn-secondary">Export Payslips (CSV)</button>
                <button id="exportPdfBtn" class="btn btn-outline-secondary">Export Report (PDF)</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Active Streams Card -->
        <div class="col-lg-8 col-md-6">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-success text-white">
              <h5 class="mb-0">Active Streams</h5>
            </div>
            <div class="card-body">
              <div class="row mb-4">
                <div class="col-md-4">
                  <div class="stat-box">
                    <div class="stat-label">Total Deposited</div>
                    <div class="stat-value" id="totalDeposited">0</div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="stat-box">
                    <div class="stat-label">Total Claimed</div>
                    <div class="stat-value" id="totalClaimed">0</div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="stat-box">
                    <div class="stat-label">Active Streams</div>
                    <div class="stat-value" id="activeCount">0</div>
                  </div>
                </div>
              </div>
              <div class="table-responsive">
                <table id="streamsTable" class="table table-hover">
                  <thead class="table-light">
                    <tr>
                      <th>Recipient</th>
                      <th>Rate/min</th>
                      <th>Accrued</th>
                      <th>Claimed</th>
                      <th>Start</th>
                      <th>End</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-light border-top py-4 mt-auto">
    <div class="container-fluid text-center">
      <small class="text-muted">© 2024 Coxygen Streaming Payroll System</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/walletManager.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
